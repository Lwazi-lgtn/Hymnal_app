<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAC Hymnal</title>

    <!-- Applies the saved/preferred theme before first paint, so there's
         no flash of the wrong theme while app.js is still loading. -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('oacHymnalTheme');
                var theme = (stored === 'dark' || stored === 'light')
                    ? stored
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                // localStorage can throw in some locked-down browser contexts; default to light.
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d3557">

</head>
<body>

<!-- Shown when a new deployed version has taken over in the background -->
<div id="updateBanner" class="hidden" role="status">
    <span>A new version of the app is available.</span>
    <button id="updateReloadBtn">Refresh</button>
</div>

<header>
  <div class="logo-text">
        <span class="oac">OAC</span>
        <span class="church-name">Old Apostolic Church</span>
       
    </div>


    <h1 id="pageHeading">Welcome to the OAC Hymnal</h1>
    <h2 id="pageSubheading">Experience the Power of Worship</h2>

    <label for="searchInput" class="sr-only">Search hymns by number or title</label>
    <input type="text" id="searchInput" placeholder="Search by hymn number or title...">
</header>

<main>
    <!-- Book title slideshow (English ↔ isiXhosa) -->
    <div id="verseSlideshow">
        <div id="verseText"></div>
    </div>

    <div id="loading">
        <span id="loadingText">Loading hymns...</span>
        <button id="retryBtn" class="hidden">Retry</button>
    </div>

    <!-- Hymn List -->
    <div id="hymnList"></div>

    <!-- Pagination -->
    <div id="pagination">
        <button id="prevBtn">Prev</button>
        <button id="nextBtn">Next</button>
    </div>

    <!-- Single Hymn View -->
    <div id="hymnDetails" class="hidden">
        <div class="hymn-toolbar">
            <div class="font-controls" role="group" aria-label="Text size">
                <button id="decreaseFontBtn" aria-label="Decrease text size">A−</button>
                <button id="increaseFontBtn" aria-label="Increase text size">A+</button>
            </div>
        </div>

        <p id="hymnTitle"></p>
        <div id="hymnLyrics"></div>

        <button id="backBtn">Back</button>
    </div>

    <p id="noResults" class="hidden">No hymn found 😬</p>
</main>

<!-- Footer -->
<footer>
    <div class="footer-info">© 2026 OAC Hymnal • All Rights Reserved</div>
</footer>

<script src="app.js"></script>
</body>
</html>
